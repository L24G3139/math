<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>パスカルの定理の証明：穴埋めクイズ</title>
<style>
  body { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; max-width: 680px; margin: 20px auto; padding: 0 16px; background: #fafafa; color: #222; }
  h1 { font-size: 20px; }
  .topbar { display:flex; justify-content:space-between; align-items:center; font-size: 13px; color: #666; margin-bottom: 8px; }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 18px; }
  .figure { display:flex; justify-content:center; margin-bottom: 4px; }
  .figure svg { width: 100%; max-width: 320px; height: auto; display: block; }
  .legend { font-size: 12px; color: #666; text-align: center; margin: 0 0 14px; }
  .qtext { font-size: 15px; line-height: 2; margin: 0 0 14px; white-space: pre-wrap; }
  .answers { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom: 10px; }
  .answers .lbl { font-size: 14px; }
  input[type=text] { font-size: 14px; padding: 6px 8px; border: 1px solid #bbb; border-radius: 6px; text-align: center; }
  .feedback { font-size: 14px; line-height: 1.7; margin-bottom: 10px; }
  .ok { color: #0F6E56; }
  .bad { color: #A32D2D; }
  button { font-size: 14px; padding: 8px 16px; border: 1px solid #bbb; border-radius: 6px; background: #fff; cursor: pointer; margin-right: 8px; margin-top: 4px; }
  button:hover { background: #f0f0f0; }
  .score { font-weight: bold; }
</style>
</head>
<body>
<h1>パスカルの定理の証明：ステップ穴埋めクイズ</h1>
<div class="topbar">
  <span id="progress">問題 1 / 10</span>
  <span class="score" id="score">スコア 0 / 10</span>
</div>
<div class="card">
  <div class="figure" id="figure"></div>
  <div class="legend">オレンジ：△XYZの頂点（点線が△XYZの辺）　／　緑：パスカル線上の点 P, Q, R</div>
  <p class="qtext" id="qtext"></p>
  <div class="answers" id="answerArea"></div>
  <div class="feedback" id="feedback"></div>
  <div>
    <button id="checkBtn">確認</button>
    <button id="nextBtn" style="display:none;">次の問題 →</button>
    <button id="retryBtn" style="display:none;">最初からやり直す</button>
  </div>
</div>

<script>
// ============================================================
// 図形描画モジュール (point-based geometry renderer)
// ============================================================
function geomFig(W, H, points, opts){
  opts = opts || {};
  const segments = opts.segments || [];
  const circles = opts.circles || [];
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  circles.forEach(c => {
    svg += `<circle cx="${c.cx}" cy="${c.cy}" r="${c.r}" fill="none" stroke="${c.color || '#999'}" stroke-width="1.5"/>`;
  });

  segments.forEach(s => {
    const a = points[s.from], b = points[s.to];
    const dash = s.dash ? ` stroke-dasharray="${s.dash}"` : '';
    svg += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${s.color || '#534AB7'}" stroke-width="2"${dash}/>`;
  });

  Object.keys(points).forEach(name => {
    const p = points[name];
    const r = p.r != null ? p.r : 4;
    const color = p.color || '#222';
    const lx = p.x + (p.lx != null ? p.lx : 0);
    const ly = p.y + (p.ly != null ? p.ly : -10);
    const anchor = p.anchor || 'middle';
    svg += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${color}"/>`;
    svg += `<text x="${lx}" y="${ly}" text-anchor="${anchor}" font-size="18" fill="${color}">${name}</text>`;
  });

  svg += `</svg>`;
  return svg;
}

// --- 共通図：円に内接する六角形ABCDEFと、△XYZ、パスカル線上のP,Q,R ---
const figMain = geomFig(440, 440, {
  A: { x: 165, y: 321, ly: 16 },
  B: { x: 130, y: 249, lx: -14, ly: 4 },
  C: { x: 306, y: 276, lx: 14, ly: 4 },
  D: { x: 185, y: 167, ly: -12 },
  E: { x: 290, y: 193, lx: 14, ly: -6 },
  F: { x: 240, y: 338, ly: 18 },
  X: { x: 20,  y: 19,  color: '#D85A30', lx: -8, ly: -8 },
  Y: { x: 272, y: 245, color: '#D85A30', lx: 16, ly: 4 },
  Z: { x: 212, y: 419, color: '#D85A30', ly: 18 },
  P: { x: 78,  y: 141, color: '#0F6E56', lx: -16, ly: -6, r: 5 },
  Q: { x: 263, y: 269, color: '#0F6E56', lx: 16, ly: 16, r: 5 },
  R: { x: 420, y: 379, color: '#0F6E56', lx: 16, ly: 8, r: 5 }
}, {
  circles: [{ cx: 220, cy: 250, r: 90 }],
  segments: [
    { from: 'A', to: 'B' }, { from: 'B', to: 'C' }, { from: 'C', to: 'D' },
    { from: 'D', to: 'E' }, { from: 'E', to: 'F' }, { from: 'F', to: 'A' },
    { from: 'Z', to: 'X', color: '#D9A26B', dash: '4 4' },
    { from: 'X', to: 'Y', color: '#D9A26B', dash: '4 4' },
    { from: 'Y', to: 'Z', color: '#D9A26B', dash: '4 4' },
    { from: 'P', to: 'R', color: '#3FA88A', dash: '6 4' }
  ]
});

// ---- 解答チェック用ヘルパー ----
// 「AB」「ba」のように2文字の線分・直線名を正規化（順序・大文字小文字を無視）
function segNorm(s){
  const t = (s || '').replace(/\s+/g,'').toUpperCase();
  if (t.length !== 2) return t;
  return [t[0], t[1]].sort().join('');
}
function isOne(s){ return (s||'').trim() === '1'; }
function setEqual2(a1, a2, b1, b2){
  // {a1,a2} と {b1,b2} が（segNorm後）同じ集合かどうか
  const A = [segNorm(a1), segNorm(a2)].sort();
  const B = [segNorm(b1), segNorm(b2)].sort();
  return A[0]===B[0] && A[1]===B[1];
}
// 2つの分数 {num,den} の組が、期待する2つの分数の組と集合として一致するか
function fracSetEqual(f1, f2, e1, e2){
  function match(f,e){ return segNorm(f.num)===segNorm(e.num) && segNorm(f.den)===segNorm(e.den); }
  return (match(f1,e1) && match(f2,e2)) || (match(f1,e2) && match(f2,e1));
}

const questions = [
  // Q1: △XYZ の定義
  {
    text: "円に内接する六角形ABCDEFがある。対辺の延長線の交点を P（直線ABと直線DEの交点）、Q（直線BCと直線EFの交点）、R（直線CDと直線FAの交点）とする。\n\nさらに、直線AB, CD, EFをそれぞれ延長して三角形XYZをつくる（図のオレンジの点線）。図を見て、X, Y, Zがそれぞれ「どの2本の直線」の交点か答えなさい（例：AB）。\n\nX = 直線 {{x1}} と 直線 {{x2}} の交点\nY = 直線 {{y1}} と 直線 {{y2}} の交点\nZ = 直線 {{z1}} と 直線 {{z2}} の交点",
    blanks: [
      { key:'x1', width:48 }, { key:'x2', width:48 },
      { key:'y1', width:48 }, { key:'y2', width:48 },
      { key:'z1', width:48 }, { key:'z2', width:48 }
    ],
    check: v => setEqual2(v.x1, v.x2, 'AB', 'CD') && setEqual2(v.y1, v.y2, 'CD', 'EF') && setEqual2(v.z1, v.z2, 'EF', 'AB'),
    template: v => `X=AB∩CD, Y=CD∩EF, Z=EF∩AB`,
    explain: "X=AB∩CD, Y=CD∩EF, Z=EF∩ABです。点Pは辺ZX上、Qは辺YZ上、Rは辺XY上にあることに注目しましょう。"
  },

  // Q2: Step1 メネラウスの定理を3本の割線に適用
  {
    text: "△XYZ に対して、3本の直線（割線）BCQ, DEP, FAR をそれぞれ適用してメネラウスの定理を立てると、次の3つの式が得られる。空欄に当てはまる数を答えなさい。\n\n直線BCQ：(XB/BZ)・(ZQ/QY)・(YC/CX) = {{a}}\n直線DEP：(XP/PZ)・(ZE/EY)・(YD/DX) = {{b}}\n直線FAR：(XA/AZ)・(ZF/FY)・(YR/RX) = {{c}}",
    blanks: [ { key:'a', width:50 }, { key:'b', width:50 }, { key:'c', width:50 } ],
    check: v => isOne(v.a) && isOne(v.b) && isOne(v.c),
    template: v => `= 1, 1, 1`,
    explain: "メネラウスの定理は「割線が3辺(またはその延長)を切るときの比の積は常に1」というものなので、いずれも1になります。"
  },

  // Q3: 直線BCQの式を ZQ/QY について解く
  {
    text: "直線BCQの式 (XB/BZ)・(ZQ/QY)・(YC/CX) = 1 を ZQ/QY について解くと、次のようになる。空欄を埋めなさい。\n\nZQ/QY = ( {{n1}} / {{d1}} )・( {{n2}} / {{d2}} )",
    blanks: [ { key:'n1', width:50 }, { key:'d1', width:50 }, { key:'n2', width:50 }, { key:'d2', width:50 } ],
    check: v => fracSetEqual(
      {num:v.n1, den:v.d1}, {num:v.n2, den:v.d2},
      {num:'BZ', den:'XB'}, {num:'CX', den:'YC'}
    ),
    template: v => `ZQ/QY = (BZ/XB)・(CX/YC)`,
    explain: "両辺をXB・YCで割って、ZQ/QY = (BZ/XB)・(CX/YC) となります。"
  },

  // Q4: 直線DEPの式を XP/PZ について解く
  {
    text: "同様に、直線DEPの式 (XP/PZ)・(ZE/EY)・(YD/DX) = 1 を XP/PZ について解くと、次のようになる。空欄を埋めなさい。\n\nXP/PZ = ( {{n1}} / {{d1}} )・( {{n2}} / {{d2}} )",
    blanks: [ { key:'n1', width:50 }, { key:'d1', width:50 }, { key:'n2', width:50 }, { key:'d2', width:50 } ],
    check: v => fracSetEqual(
      {num:v.n1, den:v.d1}, {num:v.n2, den:v.d2},
      {num:'EY', den:'ZE'}, {num:'DX', den:'YD'}
    ),
    template: v => `XP/PZ = (EY/ZE)・(DX/YD)`,
    explain: "両辺をZE・YDで割って、XP/PZ = (EY/ZE)・(DX/YD) となります。"
  },

  // Q5: 直線FARの式を YR/RX について解く
  {
    text: "同様に、直線FARの式 (XA/AZ)・(ZF/FY)・(YR/RX) = 1 を YR/RX について解くと、次のようになる。空欄を埋めなさい。\n\nYR/RX = ( {{n1}} / {{d1}} )・( {{n2}} / {{d2}} )",
    blanks: [ { key:'n1', width:50 }, { key:'d1', width:50 }, { key:'n2', width:50 }, { key:'d2', width:50 } ],
    check: v => fracSetEqual(
      {num:v.n1, den:v.d1}, {num:v.n2, den:v.d2},
      {num:'AZ', den:'XA'}, {num:'FY', den:'ZF'}
    ),
    template: v => `YR/RX = (AZ/XA)・(FY/ZF)`,
    explain: "両辺をXA・ZFで割って、YR/RX = (AZ/XA)・(FY/ZF) となります。"
  },

  // Q6: Step2 3式をかけ合わせ、頂点ごとに整理する（X周りの部分）
  {
    text: "Step1で得た3つの結果\n  ZQ/QY = (BZ/XB)・(CX/YC)\n  XP/PZ = (EY/ZE)・(DX/YD)\n  YR/RX = (AZ/XA)・(FY/ZF)\nの右辺をすべてかけ合わせ、頂点X, Y, Zごとに整理すると\n\nXP/PZ・ZQ/QY・YR/RX = (★)\n\nという式になり、(★)は3つの分数の積になる。そのうち「頂点Xに関する分数」を答えなさい。\n\n( {{n1}}・{{n2}} ) / ( {{d1}}・{{d2}} )",
    blanks: [ { key:'n1', width:50 }, { key:'n2', width:50 }, { key:'d1', width:50 }, { key:'d2', width:50 } ],
    check: v => setEqual2(v.n1, v.n2, 'DX', 'CX') && setEqual2(v.d1, v.d2, 'XB', 'XA'),
    template: v => `(DX・CX)/(XB・XA)`,
    explain: "右辺のXB, XA, DX, CXを含む項を集めると (DX・CX)/(XB・XA) になります。同様にYに関する分数は (EY・FY)/(YD・YC)、Zに関する分数は (BZ・AZ)/(ZE・ZF) です。"
  },

  // Q7: Step3 方べきの定理（頂点X）
  {
    text: "頂点Xから円に向けて2本の割線XAB, XCDが引かれている（図のXからA,Bを通る直線・C,Dを通る直線）。方べきの定理より\n\nXA・XB = {{s1}}・{{s2}}\n\nが成り立つ。これを使うと、Q6で答えた (DX・CX)/(XB・XA) の値は {{r}} になる。",
    blanks: [ { key:'s1', width:50 }, { key:'s2', width:50 }, { key:'r', width:50 } ],
    check: v => setEqual2(v.s1, v.s2, 'XC', 'XD') && isOne(v.r),
    template: v => `XA・XB = XC・XD, よって 1`,
    explain: "XA・XB = XC・XD なので、(DX・CX)/(XB・XA) = (XC・XD)/(XA・XB) = 1 となります。"
  },

  // Q8: Step3 方べきの定理（頂点Y）
  {
    text: "同様に、頂点Yから円に向けて2本の割線YCD, YEFが引かれている。方べきの定理より\n\nYC・YD = {{s1}}・{{s2}}\n\nが成り立つ。これを使うと、Yに関する分数 (EY・FY)/(YD・YC) の値は {{r}} になる。",
    blanks: [ { key:'s1', width:50 }, { key:'s2', width:50 }, { key:'r', width:50 } ],
    check: v => setEqual2(v.s1, v.s2, 'YE', 'YF') && isOne(v.r),
    template: v => `YC・YD = YE・YF, よって 1`,
    explain: "YC・YD = YE・YF なので、(EY・FY)/(YD・YC) = (YE・YF)/(YC・YD) = 1 となります。"
  },

  // Q9: Step3 方べきの定理（頂点Z）
  {
    text: "同様に、頂点Zから円に向けて2本の割線ZEF, ZABが引かれている。方べきの定理より\n\nZE・ZF = {{s1}}・{{s2}}\n\nが成り立つ。これを使うと、Zに関する分数 (BZ・AZ)/(ZE・ZF) の値は {{r}} になる。",
    blanks: [ { key:'s1', width:50 }, { key:'s2', width:50 }, { key:'r', width:50 } ],
    check: v => setEqual2(v.s1, v.s2, 'ZA', 'ZB') && isOne(v.r),
    template: v => `ZE・ZF = ZA・ZB, よって 1`,
    explain: "ZE・ZF = ZA・ZB なので、(BZ・AZ)/(ZE・ZF) = (ZA・ZB)/(ZE・ZF) = 1 となります。"
  },

  // Q10: 結論
  {
    text: "Step3で求めた3つの値を(★)に代入すると\n\nXP/PZ・ZQ/QY・YR/RX = {{a}}・{{b}}・{{c}} = {{d}}\n\nとなる。よって、{{e}}より、点P, Q, Rは△XYZの辺（またはその延長）上にあり、3点は同一{{f}}上にある。\nつまり、円に内接する六角形の対辺の延長線の交点P, Q, Rは、常に一直線上に並ぶ（＝パスカルの定理）。",
    blanks: [
      { key:'a', width:50 }, { key:'b', width:50 }, { key:'c', width:50 }, { key:'d', width:50 },
      { key:'e', width:60 }, { key:'f', width:60 }
    ],
    check: v => isOne(v.a) && isOne(v.b) && isOne(v.c) && isOne(v.d)
              && (v.e||'').trim() === '逆'
              && /^直線$/.test((v.f||'').trim().replace('一',''))
              ,
    template: v => `1・1・1=1, メネラウスの定理の逆, 一直線`,
    explain: "3つの比の積が1になったので、メネラウスの定理の逆より、P, Q, Rは△XYZの一辺（またはその延長）上にあり、同一直線上にあることが示されました。これがパスカルの定理の証明です。"
  }
];

let qi = 0, score = 0, answered = false;

const qtext = document.getElementById('qtext');
const figure = document.getElementById('figure');
const answerArea = document.getElementById('answerArea');
const feedback = document.getElementById('feedback');
const progress = document.getElementById('progress');
const scoreEl = document.getElementById('score');
const checkBtn = document.getElementById('checkBtn');
const nextBtn = document.getElementById('nextBtn');
const retryBtn = document.getElementById('retryBtn');

figure.innerHTML = figMain;

function render(){
  const q = questions[qi];
  answered = false;
  progress.textContent = `問題 ${qi+1} / ${questions.length}`;
  scoreEl.textContent = `スコア ${score} / ${questions.length}`;

  // テキスト中の {{key}} を <input> に置き換えて表示する
  qtext.innerHTML = '';
  const parts = q.text.split(/(\{\{\w+\}\})/g);
  parts.forEach(part => {
    const m = part.match(/^\{\{(\w+)\}\}$/);
    if (m) {
      const b = q.blanks.find(bb => bb.key === m[1]);
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.style.width = (b.width || 50) + 'px';
      inp.id = 'blank_' + m[1];
      inp.dataset.key = m[1];
      qtext.appendChild(inp);
    } else if (part.length) {
      qtext.appendChild(document.createTextNode(part));
    }
  });

  answerArea.innerHTML = '';
  feedback.innerHTML = '';
  feedback.className = 'feedback';
  checkBtn.style.display = '';
  nextBtn.style.display = 'none';
  retryBtn.style.display = 'none';
  checkBtn.disabled = false;
}

function check(){
  if (answered) return;
  const q = questions[qi];
  const vals = {};
  q.blanks.forEach(b => {
    const inp = document.getElementById('blank_' + b.key);
    vals[b.key] = inp.value;
  });
  const ok = q.check(vals);
  q.blanks.forEach(b => {
    const inp = document.getElementById('blank_' + b.key);
    inp.style.borderColor = ok ? '#0F6E56' : '#A32D2D';
  });
  answered = true;
  checkBtn.disabled = true;
  if (ok) {
    score++;
    scoreEl.textContent = `スコア ${score} / ${questions.length}`;
    feedback.className = 'feedback ok';
    feedback.textContent = `正解！　${q.explain}`;
  } else {
    feedback.className = 'feedback bad';
    feedback.textContent = `不正解。正しい答えの例：${q.template(vals)}　／　${q.explain}`;
  }
  if (qi < questions.length - 1) {
    nextBtn.style.display = '';
  } else {
    const final = document.createElement('div');
    final.style.marginTop = '8px';
    final.textContent = `全${questions.length}問のうち ${score} 問正解でした。`;
    feedback.appendChild(final);
    retryBtn.style.display = '';
  }
}

checkBtn.addEventListener('click', check);
nextBtn.addEventListener('click', () => { qi++; render(); });
retryBtn.addEventListener('click', () => { qi = 0; score = 0; render(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (!answered) check();
    else if (qi < questions.length - 1) { qi++; render(); }
  }
});

render();
</script>
</body>
</html>
