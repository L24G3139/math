<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>パスカルの定理</title>

        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="fontstyle.css">
        <style>
            /* ── テンプレートヘッダー ── */
            #class-meta {
                padding: 48px 5% 0;
                display: none;
                border-bottom: 2px solid rgba(233,204,51,0.2);
                margin-bottom: 0;
                background: rgba(0,0,0,0.15);
            }

            #class-meta.visible { display: block; }

            .meta-eyebrow {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 12px;
            }

            .meta-note {
                font-size: 0.72em;
                font-weight: 700;
                color: #1c3c1c;
                background: #e9cc33;
                border-radius: 3px;
                padding: 2px 10px;
                letter-spacing: 0.05em;
            }

            .meta-date {
                font-size: 0.8em;
                color: #7aaa7a;
                letter-spacing: 0.04em;
            }

            .meta-title {
                font-size: 1.7em;
                font-weight: 800;
                color: #f2ecce;
                margin: 0 0 8px;
                text-align: center;
                letter-spacing: 0.03em;
            }

            .meta-subtitle {
                font-size: 0.85em;
                color: #7aaa7a;
                margin: 0 0 24px;
                text-align: center;
            }

            /* markdown の先頭 h1 はテンプレートで表示するため非表示 */
            #main-content > h1:first-child { display: none; }
        </style>
        <script>
            MathJax = {
                tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
            };
        </script>
        <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body class="sidebar">
        <header>
            <ul class="header-list">
                <li id="header-list"><a href="index.html" style="color:#fff;text-decoration:none;">🏠 ホーム</a></li>
                <li id="header-list"><a href="past.html"  style="color:#fff;text-decoration:none;">📂 過去資料</a></li>
            </ul>
        </header>

        <!-- ── テンプレートヘッダー（schedule.json から生成） ── -->
        <div id="class-meta">
            <div class="meta-eyebrow">
                <span class="meta-note" id="meta-note"></span>
                <span class="meta-date" id="meta-date"></span>
            </div>
            <h1 class="meta-title"    id="meta-title"></h1>
            <p  class="meta-subtitle" id="meta-subtitle"></p>
        </div>

        <main id="main-content">
            <!-- class/class_MMDD.md から動的に読み込まれます -->
        </main>

        <footer></footer>

        <script>
            // ── ステップ捲り ──────────────────────────────────────
            function applyStepReveal(container) {
                container.querySelectorAll('ol').forEach(ol => {
                    if (ol.closest('details')) return;
                    const items = Array.from(ol.children).filter(el => el.tagName === 'LI');
                    if (items.length < 2) return;

                    items.forEach(li => li.classList.add('step-li-hidden'));
                    let revealed = 0;

                    const bar   = document.createElement('div');
                    bar.className = 'step-bar';
                    const ind   = document.createElement('span');
                    ind.className = 'step-indicator';
                    ind.textContent = `0 / ${items.length}`;
                    const next  = document.createElement('button');
                    next.className = 'step-next-btn';
                    next.textContent = '▶ 次のステップ';
                    const reset = document.createElement('button');
                    reset.className = 'step-reset-btn';
                    reset.textContent = '↺ リセット';

                    next.addEventListener('click', () => {
                        if (revealed >= items.length) return;
                        const li = items[revealed];
                        li.classList.remove('step-li-hidden', 'step-li-visible');
                        void li.offsetWidth;
                        li.classList.add('step-li-visible');
                        revealed++;
                        ind.textContent = `${revealed} / ${items.length}`;
                        if (revealed === items.length) {
                            next.textContent = '✓ 完了';
                            next.disabled = true;
                        }
                    });

                    reset.addEventListener('click', () => {
                        items.forEach(li => {
                            li.classList.add('step-li-hidden');
                            li.classList.remove('step-li-visible');
                        });
                        revealed = 0;
                        ind.textContent = `0 / ${items.length}`;
                        next.textContent = '▶ 次のステップ';
                        next.disabled = false;
                    });

                    bar.append(ind, next, reset);
                    ol.before(bar);
                });
            }

            // ── テンプレートヘッダーの描画 ───────────────────────
            function renderMeta(entry) {
                if (!entry) return;
                const month = parseInt(entry.date.slice(0, 2));
                const day   = parseInt(entry.date.slice(2, 4));

                document.getElementById('meta-note').textContent     = entry.note  || '';
                document.getElementById('meta-date').textContent     = `${month}月${day}日`;
                document.getElementById('meta-title').textContent    = entry.title || '';
                document.getElementById('meta-subtitle').textContent = entry.subtitle || '';
                document.title = entry.title || 'パスカルの定理';
                document.getElementById('class-meta').classList.add('visible');
            }

            // ── メイン処理 ────────────────────────────────────────
            (function () {
                const d    = new Date();
                const mmdd = String(d.getMonth() + 1).padStart(2, '0')
                           + String(d.getDate()).padStart(2, '0');

                fetch('schedule.json')
                    .then(r => r.json())
                    .then(schedule => {
                        const entry = schedule.find(e => e.current)
                                   ?? schedule.find(e => e.date === mmdd)
                                   ?? null;
                        renderMeta(entry);
                        return entry ? entry.file : `class/class_${mmdd}.md`;
                    })
                    .catch(() => `class/class_${mmdd}.md`)
                    .then(file => fetch(file)
                        .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
                        .then(md => {
                            const el = document.getElementById('main-content');
                            el.innerHTML = marked.parse(md);
                            MathJax.typesetPromise([el]).then(() => applyStepReveal(el));
                        })
                        .catch(() => {
                            document.getElementById('main-content').innerHTML =
                                `<p style="padding:2rem;color:#f88">授業資料が見つかりません。</p>`;
                        })
                    );
            })();
        </script>
    </body>
</html>
