<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>数学 学習ポータル</title>
        <link rel="stylesheet" href="portal.css">
    </head>
    <body>
        <header>
            <div class="header-inner">
                <span class="header-logo">📐</span>
                <span class="header-title">数学 学習ポータル</span>
                <span class="header-badge">第2回</span>
            </div>
        </header>

        <main>
            <section class="hero">
                <p class="hero-eyebrow">本日の授業</p>
                <h1 class="hero-title">パスカルの定理</h1>
                <p class="hero-sub">メネラウスの定理と方べきの定理</p>
                <p>教科書：高等学校数学用　数学Ａ　発展</p>
            </section>

            <p class="section-label">コンテンツ</p>
            <div class="card-grid">
                <a href="class.html" class="card card-primary">
                    <div class="card-icon-wrap">📖</div>
                    <div class="card-body">
                        <h2 class="card-title">本時の学習</h2>
                        <p class="card-desc">今日の授業スライドと解説を確認する</p>
                    </div>
                    <div class="card-footer">
                        <span class="card-tag">授業</span>
                        <span class="card-arrow">→</span>
                    </div>
                </a>

                <a href="past.html" class="card card-review">
                    <div class="card-icon-wrap">📂</div>
                    <div class="card-body">
                        <h2 class="card-title">過去資料</h2>
                        <p class="card-desc">過去の授業資料を一覧で確認する</p>
                    </div>
                    <div class="card-footer">
                        <span class="card-tag">アーカイブ</span>
                        <span class="card-arrow">→</span>
                    </div>
                </a>

                <a href="exercise.html" class="card card-exercise">
                    <div class="card-icon-wrap">✏️</div>
                    <div class="card-body">
                        <h2 class="card-title">演習問題</h2>
                        <p class="card-desc">問題を解いて理解を定着させる</p>
                    </div>
                    <div class="card-footer">
                        <span class="card-tag">証明</span>
                        <span class="card-arrow">→</span>
                    </div>
                </a>
            </div>

            <div class="info-row">
                <div class="info-card">
                    <h3>本時のめあて</h3>
                    <ul class="goal-list">
                        <li>接線の長さを求められる</li>
                        <li>方べきの定理を用いて、円の弦の長さを求められる</li>
                    </ul>
                </div>
                <div class="info-card">
                    <h3>学習トピック</h3>
                    <div class="topic-chips">
                        <span class="chip">円周角の定理</span>
                        <span class="chip">接弦定理</span>
                        <span class="chip">相似条件 SSS</span>
                        <span class="chip">相似条件 SAS</span>
                        <span class="chip">相似条件 AA</span>
                        <span class="chip">面積比・体積比</span>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p class="footer-text">数学科教育法３ — 第2回</p>
        </footer>
    </body>
</html>
